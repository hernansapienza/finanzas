<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0b0d; --s1:#111318; --s2:#16181f; --s3:#1c1f27;
  --bdr:#22252e; --bdr2:#2a2d38;
  --lime:#1a6cf6; --lime-dim:rgba(26,108,246,.14); --lime-glow:rgba(26,108,246,.08);
  --green:#34d47a; --green-dim:rgba(52,212,122,.08);
  --red:#c83250; --orange:#fb923c; --blue:#1a6cf6;
  --txt:#f0f1f3; --txt2:#9ca3af; --txt3:#5a6070;
}

/* =========================================
   REGLAS TIPOGRÁFICAS GLOBALES 
   ========================================= */
body, button, select, input, textarea, .th, .ch, .slabel, .lbl, .title, .ct, .tt {
  font-family: 'Manrope', sans-serif;
  color: var(--txt);
  -webkit-font-smoothing: antialiased;
}

input[type=number], .cur, .tval-usd, .tval-ars, td, .mono {
  font-family: 'JetBrains Mono', monospace !important;
}

/* =========================================
   JERARQUÍA VISUAL (Títulos y Textos)
   ========================================= */
.title { font-size: 1.35rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 0.2rem; }
.ct, .tt { font-size: 1rem; font-weight: 800; letter-spacing: -0.01em; color: var(--txt); text-transform: none; display: flex; align-items: center; }
.slabel { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--txt3); margin-bottom: 0.5rem; display: block; }
.lbl { font-size: 0.85rem; font-weight: 600; color: var(--txt2); min-width: 140px; white-space: nowrap; }

/* Datos Numéricos */
.tval-usd { font-size: 2.1rem; font-weight: 800; color: var(--lime); letter-spacing: -0.05em; line-height: 1.1; margin-bottom: 0.4rem; }
.tval-ars { font-size: 0.9rem; font-weight: 500; color: var(--txt2); }
input[type=number] { font-size: 1rem; font-weight: 600; text-align: right; background: transparent; border: none; outline: none; width: 100%; color: var(--txt); -moz-appearance: textfield; }
input[type=number]::-webkit-outer-spin-button, input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }

body { background: var(--bg); font-size: 14px; min-height: 100vh; }
.page { max-width: 520px; margin: 0 auto; padding: 2rem 1rem 4rem; display: flex; flex-direction: column; gap: 1.25rem; }

/* =========================================
   TARJETAS (ESTILOS BASE / MOBILE FIRST)
   ========================================= */
.card { background: var(--s1); border: 1px solid var(--bdr); border-radius: 12px; padding: 1.5rem; display: flex; flex-direction: column; justify-content: space-between; }
.chart-card { background: var(--s1); border: 1px solid var(--bdr); border-radius: 12px; padding: 1.5rem; }

/* En celular, la tarjeta de la tabla tiene un alto fijo de 400px para que no sea infinita */
.tcrd { background: var(--s1); border: 1px solid var(--bdr); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; height: 400px; }


/* =========================================
   GRID DESKTOP Y ALTURAS FIJAS (PC)
   Esto sobreescribe el Mobile al final
   ========================================= */
@media(min-width:800px){
  .page { max-width: 1080px; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto auto; gap: 1.25rem; align-items: start; }
  .card { grid-column: 1; grid-row: 1; }
  .tcrd { grid-column: 2; grid-row: 1; }
  .chart-card { grid-column: 1 / -1; grid-row: 2; }
  
  /* Acá volvemos a igualar ambas tarjetas a 540px en la PC */
  .card, .tcrd { height: 540px; } 
  .cw { height: 300px; }
}


/* Decoración del título */
.title::after { content: ''; display: inline-block; width: 6px; height: 6px; background: var(--lime); border-radius: 50%; margin-left: .45rem; vertical-align: middle; position: relative; top: -2px; }

/* Wrappers */
.inputs-wrapper { background: var(--s2); border: 1px solid var(--bdr2); border-radius: 10px; padding: 0.85rem 1.25rem; margin-bottom: 1rem; }
.row { display: flex; align-items: center; justify-content: space-between; padding: .45rem 0; gap: .75rem; }
.iw { display: flex; align-items: center; gap: .35rem; background: var(--s3); border: 1px solid var(--bdr2); border-radius: 8px; padding: .38rem .65rem; transition: border-color .15s; flex: 1; max-width: 170px; }
.iw:focus-within { border-color: var(--lime); box-shadow: 0 0 0 3px var(--lime-glow); }
.cur { color: var(--txt3); font-size: .68rem; font-weight: 600; user-select: none; white-space: nowrap; }

/* Summary Grid */
.summary-grid { display: flex; align-items: center; justify-content: space-between; gap: 1rem; background: var(--s2); border: 1px solid var(--bdr2); border-radius: 12px; padding: 1.15rem 1.25rem; margin-bottom: 1rem; }
.summary-info { flex: 1; display: flex; flex-direction: column; }
.ars-subline { display: flex; align-items: center; gap: 0.5rem; }
.mep-badge { font-size: 0.65rem; font-weight: 700; background: var(--s3); border: 1px solid var(--bdr2); padding: 0.2rem 0.5rem; border-radius: 4px; color: var(--txt3); letter-spacing: 0.05em; text-transform: uppercase; }

/* Anillo */
.summary-chart { width: 130px; height: 130px; position: relative; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }

/* Botones */
.brow { display: flex; gap: .5rem; margin-top: auto; }
.btn { flex: 1; padding: .7rem .5rem; border-radius: 8px; border: none; cursor: pointer; font-size: .8rem; font-weight: 700; letter-spacing: .02em; transition: all .15s; display: flex; align-items: center; justify-content: center; gap: .4rem; }
.btn:disabled { opacity: .4; cursor: not-allowed; transform: none !important; }
.btn-s { background: var(--lime); color: #fff; }
.btn-s:hover:not(:disabled) { background: #3d7ef7; transform: translateY(-1px); }
.btn-s.ok { background: rgba(52,212,122,.15); border: 1px solid rgba(52,212,122,.3); color: var(--green); }
.btn-c { background: var(--s3); border: 1px solid var(--bdr2); color: var(--txt2); }
.btn-c:hover:not(:disabled) { background: var(--s2); color: var(--txt); transform: translateY(-1px); }

/* Status */
.smsg { font-size: .65rem; color: var(--txt3); text-align: center; margin-top: .45rem; min-height: 1.2em; }
.smsg.err { color: var(--red); }
.status-bar { display: flex; align-items: center; gap: .5rem; font-size: .65rem; font-weight: 600; color: var(--txt3); padding: .45rem .75rem; background: var(--s2); border-radius: 8px; margin-top: .65rem; border: 1px solid var(--bdr); }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--txt3); flex-shrink: 0; }
.dot.ok { background: var(--green); }
.dot.err { background: var(--red); }
.dot.loading { background: var(--lime); animation: pulse 1s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }

/* Chart card header & legend */
.ch { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: .75rem; flex-wrap: wrap; gap: .4rem; }
.cs { font-size: .65rem; color: var(--txt3); font-family: 'JetBrains Mono', monospace; }
.leg { display: flex; gap: .5rem; margin-bottom: .75rem; flex-wrap: wrap; }
.li { display: flex; align-items: center; gap: .35rem; font-size: .7rem; font-weight: 600; color: var(--txt2); }
.ld { width: 7px; height: 7px; border-radius: 2px; flex-shrink: 0; }
.leg-btn[data-ds="3"] .ld { width: 14px; height: 2px; border-radius: 1px; margin-top: 1px; }
.leg-btn { cursor: pointer; padding: .2rem .55rem; border-radius: 6px; transition: all .12s; border: 1px solid transparent; user-select: none; }
.leg-btn:hover { background: var(--s3); border-color: var(--bdr2); }
.leg-btn.active { opacity: 1; }
.leg-btn.inactive { opacity: .3; }
.leg-btn[data-ds="all"] { border-color: rgba(26,108,246,.25); background: var(--lime-glow); }

/* Filtros */
.filt { display: flex; align-items: center; gap: .5rem; margin-bottom: .75rem; flex-wrap: wrap; }
.filt select, .filt input[type=date] { background: var(--s3); border: 1px solid var(--bdr2); border-radius: 7px; font-size: .75rem; font-weight: 600; padding: .35rem .6rem; outline: none; cursor: pointer; }
.filt select:focus, .filt input[type=date]:focus { border-color: var(--lime); }
.filt input[type=date] { color-scheme: dark; }
.cw { position: relative; height: 220px; }

/* =========================================
   TABLA: Registro Semanal/Diario (Ultra Compacto)
   ========================================= */
.th { padding: .75rem 1rem; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--bdr); flex-shrink: 0; }

.tw { flex: 1; overflow-y: auto; overflow-x: auto; min-height: 0; }

table { width: 100%; border-collapse: collapse; }

/* Encabezados centrados */
thead th { 
  position: sticky; top: 0; background: var(--s2); z-index: 10;
  padding: .4rem .3rem; text-align: center; font-size: .6rem; font-weight: 700; 
  letter-spacing: .02em; text-transform: uppercase; color: var(--txt3); 
  border-bottom: 1px solid var(--bdr); white-space: nowrap; 
}

tbody tr { border-bottom: 1px solid rgba(255,255,255,.03); transition: background .1s; }
tbody tr:hover { background: rgba(255,255,255,.025); }

/* Celdas de datos */
tbody td { 
  padding: .3rem .3rem; 
  white-space: nowrap; font-size: .68rem; font-weight: 500; letter-spacing: -0.02em;
}

/* Primera columna centrada */
tbody td:first-child { text-align: center; }

/* Números alineados a la derecha */
tbody td:not(:first-child) { text-align: right; }

.dt { color: var(--txt3); }
.dtt { color: var(--lime); font-weight: 700; }

.xb { background: none; border: none; cursor: pointer; color: var(--txt3); font-size: .65rem; padding: .1rem .2rem; border-radius: 4px; transition: color .12s, background .12s; }
.xb:hover { color: var(--red); background: rgba(255,79,79,.1); }

.es { padding: 2rem; text-align: center; color: var(--txt3); font-size: .8rem; font-weight: 600; line-height: 1.9; }

/* Scrollbars */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bdr2); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--txt3); }
</style>
</head>
<body>
<div class="page">

<div class="card">
  <div class="header">
    <div class="title">Resumen Patrimonial</div>
  </div>
  
  <div class="inputs-wrapper">
    <span class="slabel">Activos Actuales (USD)</span>
    <div class="row">
      <span class="lbl" style="color:var(--red)">Caja de Seguridad</span>
      <div class="iw"><span class="cur">U$D</span><input type="number" id="caja" step="0.01" min="0" placeholder="0.00"></div>
    </div>
    <div class="row">
      <span class="lbl" style="color:var(--blue)">Balanz</span>
      <div class="iw"><span class="cur">U$D</span><input type="number" id="balanz" step="0.01" min="0" placeholder="0.00"></div>
    </div>
    <div class="row" style="padding-bottom: 0;">
      <span class="lbl" style="color:var(--orange)">FCI Banco Galicia</span>
      <div class="iw"><span class="cur">U$D</span><input type="number" id="fci" step="0.01" min="0" placeholder="0.00"></div>
    </div>
  </div>

  <div class="summary-grid">
    <div class="summary-info">
      <span class="slabel">Patrimonio Total</span>
      <div class="tval-usd" id="total">U$D 0,00</div>
      <div class="ars-subline">
        <span id="mep-badge" class="mep-badge">Calculando MEP...</span>
        <span class="tval-ars" id="total-ars">&#x2014;</span>
      </div>
    </div>
    <div class="summary-chart">
      <canvas id="donutChart"></canvas>
    </div>
  </div>

  <div class="brow">
    <button class="btn btn-s" id="saveBtn" onclick="saveRecord()">&#x1F4BE; Guardar Snapshot</button>
  </div>

  <div class="status-bar">
    <div class="dot" id="sdot"></div>
    <span id="stxt">Conectando con Google Sheets...</span>
  </div>
  <div class="smsg" id="smsg"></div>
</div>

<div class="tcrd">
  <div class="th">
    <span class="tt">Registro Semanal/Diario</span>
    <button class="btn btn-c" style="flex:none;padding:.3rem .6rem;font-size:.7rem" onclick="exportCSV()">&#x2B07; Exportar CSV</button>
  </div>
  <div class="tw">
    <table>
      <thead><tr><th>Fecha</th><th>Caja</th><th>Balanz</th><th>FCI</th><th>Total</th><th></th></tr></thead>
      <tbody id="tb"></tbody>
    </table>
    <div class="es" id="es">Cargando...</div>
  </div>
</div>

<div class="chart-card">
  <div class="ch">
    <span class="ct">Evoluci&#xF3;n Hist&#xF3;rica</span>
    <span class="cs" id="cr">&#x2014;</span>
  </div>
  <div class="leg" id="chartLegend">
    <div class="li leg-btn active" data-ds="all" onclick="toggleDataset('all')"><div class="ld" style="background:var(--lime)"></div>Todos</div>
    <div class="li leg-btn active" data-ds="0" onclick="toggleDataset('0')"><div class="ld" style="background:#fb923c"></div>FCI Galicia</div>
    <div class="li leg-btn active" data-ds="1" onclick="toggleDataset('1')"><div class="ld" style="background:#c83250"></div>Caja</div>
    <div class="li leg-btn active" data-ds="2" onclick="toggleDataset('2')"><div class="ld" style="background:#1a6cf6"></div>Balanz</div>
    <div class="li leg-btn active" data-ds="3" onclick="toggleDataset('3')"><div class="ld" style="background:#f0f1f3"></div>Total</div>
  </div>
  <div class="filt">
    <select id="filtPreset" onchange="applyPreset()">
      <option value="all">Todo el per&#xED;odo</option>
      <option value="1m">&#xDA;ltimo mes</option>
      <option value="3m">&#xDA;ltimos 3 meses</option>
      <option value="6m">&#xDA;ltimos 6 meses</option>
      <option value="1y">&#xDA;ltimo a&#xF1;o</option>
      <option value="ytd">Año en curso (YTD)</option>
       <option value="custom">Personalizado...</option>
    </select>
    <div id="customDates" style="display:none">
      <input type="date" id="dateFrom" onchange="applyFilter()">
      <span style="color:var(--txt3)">&#x2192;</span>
      <input type="date" id="dateTo" onchange="applyFilter()">
    </div>
  </div>
  <div class="cw"><canvas id="myChart"></canvas></div>
</div>

</div>
<script>
// Registrar Plugin DataLabels globalmente
Chart.register(ChartDataLabels);

var API = 'https://script.google.com/macros/s/AKfycbwMl6_E65FQsKsfdOTevehehPHWU2BzI9ZN7p6TUeki8605Vn8Z3HSRKVlKdAoxFynXeQ/exec';

  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return 'U$D ' + parts[0] + ',' + parts[1];
}

/* NUEVA FUNCIÓN: Formatea solo el número para ahorrar espacio en la tabla */
function fmtT(n) {
  var parts = Number(n).toFixed(2).split('.');
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return parts[0] + ',' + parts[1];
}

function todayISO() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function ddisp(iso) {
  var p = String(iso).substring(0, 10).split('-');
  return p.length===3 ? p[2]+'/'+p[1]+'/'+p[0] : String(iso);
}

function setStatus(state, txt) {
  document.getElementById('sdot').className = 'dot' + (state ? ' '+state : '');
  document.getElementById('stxt').textContent = txt;
}

// ── MEP ──
var mepVal = null;
function fmtARS(n) {
  var parts = Number(n).toFixed(2).split('.');
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return 'ARS ' + parts[0] + ',' + parts[1];
}
var MEP_SOURCES = [
  { url: 'https://dolarapi.com/v1/dolares/bolsa', parse: function(d) { return parseFloat(d.venta || d.compra || 0); } },
  { url: 'https://api.argentinadatos.com/v1/cotizaciones/dolares/mep', parse: function(d) { var arr = Array.isArray(d)?d:[]; var last=arr.length?arr[arr.length-1]:null; return last?parseFloat(last.venta||last.compra||0):0; } }
];
function setBadge(txt, ok) {
  var b = document.getElementById('mep-badge');
  b.textContent = txt; b.style.color = ok ? 'var(--lime)' : 'var(--txt3)'; b.style.borderColor = ok ? 'rgba(26,108,246,0.3)' : 'var(--bdr2)';
}
function tryMEPSource(i) {
  if (i >= MEP_SOURCES.length) { setBadge('MEP OFF', false); return; }
  fetch(MEP_SOURCES[i].url)
    .then(function(r) { if (!r.ok) throw new Error(); return r.json(); })
    .then(function(d) {
      var v = MEP_SOURCES[i].parse(d);
      if (v > 0) { mepVal = v; setBadge('MEP $' + Math.round(v).toLocaleString('es-AR'), true); calc(); } 
      else tryMEPSource(i + 1);
    }).catch(function() { tryMEPSource(i + 1); });
}
function fetchMEP() { setBadge('Buscando MEP...', false); tryMEPSource(0); }

// ── CHART.JS DONUT (Con DataLabels externos) ──
var donutInst = null;
function updateDonut(c, b, f) {
  if(!donutInst) {
    donutInst = new Chart(document.getElementById('donutChart'), {
      type: 'doughnut',
      data: {
        labels: ['Caja', 'Balanz', 'FCI'],
        datasets: [{
          data: [c, b, f],
          backgroundColor: ['#c83250', '#1a6cf6', '#fb923c'],
          borderWidth: 0,
          hoverOffset: 2
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false, 
        cutout: '65%', 
        layout: { padding: 20 }, 
        plugins: { 
          legend: { display: false },
          datalabels: {
            color: '#f0f1f3',
            anchor: 'end',
            align: 'end', 
            offset: 4,     
            font: { family: 'JetBrains Mono', weight: 700, size: 11 },
            formatter: function(val, ctx) {
              var t = ctx.chart.data.datasets[0].data.reduce(function(a,b){return a+b;},0);
              if(val === 0 || t === 0) return '';
              return Math.round((val/t)*100) + '%';
            }
          },
          tooltip: {
            backgroundColor: '#16181f', borderColor: '#2a2d38', borderWidth: 1,
            bodyColor: '#f0f1f3', bodyFont: { family: 'JetBrains Mono', size: 11 }, 
            displayColors: true,
            callbacks: {
              label: function(ctx) {
                var t = ctx.dataset.data.reduce(function(a,b){return a+b;},0);
                return ' ' + ctx.label + ': ' + (t > 0 ? Math.round((ctx.parsed/t)*100) : 0) + '%';
              }
            }
          }
        }
      }
    });
  } else {
    donutInst.data.datasets[0].data = [c, b, f]; donutInst.update();
  }
}

function calc() {
  var c = parseFloat(document.getElementById('caja').value) || 0;
  var b = parseFloat(document.getElementById('balanz').value) || 0;
  var f = parseFloat(document.getElementById('fci').value) || 0;
  var t = c + b + f;
  
  document.getElementById('total').textContent = fmt(t);
  var arsEl = document.getElementById('total-ars');
  if (arsEl) arsEl.textContent = (mepVal && t > 0) ? fmtARS(t * mepVal) : (t===0 ? fmtARS(0) : '—');
  
  updateDonut(c, b, f);
}
['caja','balanz','fci'].forEach(function(id) { document.getElementById(id).addEventListener('input', calc); });

// ── API / SHEET ──
function loadFromSheet() {
  setStatus('loading', 'Cargando datos...'); document.getElementById('saveBtn').disabled = true;
  fetch(API + '?action=get').then(function(r) { return r.json(); }).then(function(res) {
    if (res.records && res.records.length > 0) {
      cache = res.records.map(function(r) { return {date:r.date.substring(0,10), caja:r.caja, balanz:r.balanz, fci:r.fci||0, total:r.total}; });
      seeded = true; setStatus('ok', 'Sincronizado \u2022 ' + cache.length + ' regs');
    } else throw new Error();
    fillLatest(); renderAll(); document.getElementById('saveBtn').disabled = false;
  }).catch(function() {
    cache = SEED.slice(); setStatus('err', 'Modo Offline (Usando Cache)');
    fillLatest(); renderAll(); document.getElementById('saveBtn').disabled = false;
  });
}

function saveRecord() {
  var c = parseFloat(document.getElementById('caja').value)||0, b = parseFloat(document.getElementById('balanz').value)||0, f = parseFloat(document.getElementById('fci').value)||0;
  var rec = {date:todayISO(), caja:c, balanz:b, fci:f, total:c+b+f};
  var idx = cache.findIndex(function(r){return r.date===rec.date;});
  if (idx >= 0) cache[idx] = rec; else cache.push(rec);
  cache.sort(function(x,y){return x.date < y.date ? -1 : 1;}); renderAll();
  
  var btn = document.getElementById('saveBtn'); btn.textContent = '\u2713 Guardado'; btn.classList.add('ok');
  setStatus('loading', 'Subiendo a Sheets...');
  fetch(API, {method:'POST', body:JSON.stringify({action:'upsert', record:rec})})
    .then(function(r){return r.json();})
    .then(function(r){ if(r.ok) setStatus('ok', 'Respaldo exitoso'); else setStatus('err', 'Error Sheets'); })
    .catch(function(){ setStatus('err', 'Guardado Offline'); });
  setTimeout(function(){ btn.innerHTML='&#x1F4BE; Guardar Snapshot'; btn.classList.remove('ok'); }, 2500);
}

function delRec(d) {
  if (!confirm('¿Eliminar registro?')) return;
  cache = cache.filter(function(r){return r.date!==d;}); renderAll();
  fetch(API, {method:'POST', body:JSON.stringify({action:'delete', date:d})});
}

function exportCSV() {
  var rows = 'fecha,caja_seguridad,balanz,fci_galicia,total\n';
  cache.forEach(function(r){ rows += r.date+','+r.caja+','+r.balanz+','+(r.fci||0)+','+r.total+'\n'; });
  var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([rows], {type:'text/csv'}));
  a.download = 'patrimonio_'+todayISO()+'.csv'; a.click();
}

// ── CHARTS Y TABLAS ──
var chartInst = null;
function renderChart(h) {
  var labels = h.map(function(r){return ddisp(r.date);});
  var rng = document.getElementById('cr');
  rng.textContent = h.length>=2 ? labels[0]+' \u2192 '+labels[h.length-1] : (h.length===1 ? labels[0] : '\u2014');

  if(chartInst) chartInst.destroy();
  var pr = h.length<=30 ? 3 : (h.length<=120 ? 1 : 0);
  chartInst = new Chart(document.getElementById('myChart'), {
    type: 'line',
    data: {
      labels: labels,
      datasets: [
        { label: 'FCI Galicia', data: h.map(function(r){return r.fci||0;}), fill: 'origin', backgroundColor: 'rgba(251,146,60,0.18)', borderColor: 'rgba(251,146,60,0.8)', borderWidth: 1.5, pointRadius: pr, tension: 0.38, order: 3 },
        { label: 'Caja', data: h.map(function(r){return r.caja||0;}), fill: 'origin', backgroundColor: 'rgba(200,50,80,0.18)', borderColor: 'rgba(200,50,80,0.8)', borderWidth: 1.5, pointRadius: pr, tension: 0.38, order: 2 },
        { label: 'Balanz', data: h.map(function(r){return r.balanz||0;}), fill: 'origin', backgroundColor: 'rgba(26,108,246,0.18)', borderColor: 'rgba(61,126,247,0.85)', borderWidth: 1.5, pointRadius: pr, tension: 0.38, order: 1 },
        { label: 'Total', data: h.map(function(r){return r.total;}), fill: false, backgroundColor: '#f0f1f3', borderColor: 'rgba(240,241,243,0.9)', borderWidth: 2.5, pointRadius: pr, tension: 0.38, order: 0 }
      ]
    },
    options:{
      responsive:true, maintainAspectRatio:false, interaction:{mode:'index',intersect:false},
      plugins:{ 
        legend:{display:false}, 
        datalabels: { display: false }, 
        tooltip:{ backgroundColor:'#16181f', borderColor:'#2a2d38', borderWidth:1, bodyColor:'#f0f1f3', titleFont:{ family:'Manrope', size:12, weight: 800 }, bodyFont:{ family:'JetBrains Mono', size:11 } } 
      },
      scales:{ 
        x: { display:false }, 
        y: { grid:{ color:'rgba(255,255,255,0.04)' }, ticks:{ color:'#6b7280', font:{ family:'JetBrains Mono', size:10 } } } 
      }
    }
  });
}

function renderTable(h) {
  var tb = document.getElementById('tb'), es = document.getElementById('es'); tb.innerHTML='';
  if(!h.length){ es.style.display='block'; return; } es.style.display='none';
  
  // Ahora usamos la función fmtT para que no imprima "U$D"
  h.slice().reverse().forEach(function(r){
    var tr=document.createElement('tr');
    tr.innerHTML='<td class="dt">'+ddisp(r.date)+'</td><td>'+fmtT(r.caja)+'</td><td>'+fmtT(r.balanz)+'</td><td>'+fmtT(r.fci||0)+'</td><td class="dtt">'+fmtT(r.total)+'</td><td><button class="xb" onclick="delRec(\''+r.date+'\')">&#x2715;</button></td>';
    tb.appendChild(tr);
  });
}

function renderAll(){ renderChart(cache); renderTable(cache); }
function fillLatest() {
  if (!cache.length) return; var l = cache[cache.length - 1];
  document.getElementById('caja').value = l.caja||''; document.getElementById('balanz').value = l.balanz||''; document.getElementById('fci').value = l.fci||''; calc();
}

function applyPreset() {
  var v = document.getElementById('filtPreset').value, custom = document.getElementById('customDates');
  if (v === 'custom') { custom.style.display = 'flex'; return; } custom.style.display = 'none';
  var t = todayISO(), f = null;
  if(v==='1m') f=offset(t,-1); else if(v==='3m') f=offset(t,-3); else if(v==='6m') f=offset(t,-6); else if(v==='1y') f=offset(t,-12); else if(v==='ytd') f=new Date().getFullYear()+'-01-01';
  renderChart(f ? cache.filter(function(r){return r.date>=f && r.date<=t;}) : cache);
}
function applyFilter() {
  var f = document.getElementById('dateFrom').value, t = document.getElementById('dateTo').value;
  renderChart((!f && !t) ? cache : cache.filter(function(r){ return !(f&&r.date<f) && !(t&&r.date>t); }));
}
function offset(iso, m) {
  var d = new Date(iso+'T00:00:00'); d.setMonth(d.getMonth()+m);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function toggleDataset(idx) {
  var btns = document.querySelectorAll('.leg-btn');
  if (idx === 'all') {
    chartInst.data.datasets.forEach(function(ds, i) { chartInst.setDatasetVisibility(i, true); });
    btns.forEach(function(b) { b.classList.add('active'); b.classList.remove('inactive'); });
  } else {
    var d = parseInt(idx), vis = chartInst.isDatasetVisible(d), cnt = 0;
    chartInst.data.datasets.forEach(function(ds, i) { if (chartInst.isDatasetVisible(i)) cnt++; });
    if (vis && cnt === 1) { toggleDataset('all'); return; }
    chartInst.setDatasetVisibility(d, !vis);
    btns.forEach(function(b) {
      var id = b.getAttribute('data-ds');
      if (id === 'all') {
        var allVis = true; chartInst.data.datasets.forEach(function(ds, i) { if (!chartInst.isDatasetVisible(i)) allVis = false; });
        b.classList.toggle('active', allVis); b.classList.toggle('inactive', !allVis);
      } else {
        var v = chartInst.isDatasetVisible(parseInt(id));
        b.classList.toggle('active', v); b.classList.toggle('inactive', !v);
      }
    });
  }
  chartInst.update();
}

loadFromSheet(); fetchMEP(); setInterval(fetchMEP, 300000);
</script>
