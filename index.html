<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0b0d;
  --s1:#111318;
  --s2:#16181f;
  --s3:#1c1f27;
  --bdr:#22252e;
  --bdr2:#2a2d38;
  --lime:#1a6cf6;
  --lime-dim:rgba(26,108,246,.14);
  --lime-glow:rgba(26,108,246,.08);
  --green:#34d47a;
  --red:#ff4f4f;
  --blue:#4f9eff;
  --txt:#f0f1f3;
  --txt2:#9ca3af;
  --txt3:#5a6070;
}
html,body{
  background:var(--bg);
  color:var(--txt);
  font-family:'Manrope',sans-serif;
  font-size:14px;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.page{max-width:520px;margin:0 auto;padding:2rem 1rem 4rem;display:flex;flex-direction:column;gap:1rem}
@media(min-width:800px){
  .page{max-width:1080px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto;gap:1.25rem;align-items:start}
  .card{grid-column:1;grid-row:1}
  .tcrd{grid-column:2;grid-row:1}
  .chart-card{grid-column:1/-1;grid-row:2}
  .cw{height:300px}
}

/* Cards */
.card{
  background:var(--s1);
  border:1px solid var(--bdr);
  border-radius:12px;
  padding:1.5rem;
}
.chart-card{
  background:var(--s1);
  border:1px solid var(--bdr);
  border-radius:12px;
  padding:1.5rem;
}
.tcrd{
  background:var(--s1);
  border:1px solid var(--bdr);
  border-radius:12px;
  overflow:hidden;
}

/* Header */
.header{margin-bottom:1.25rem}
.emojis{display:none}
.title{
  font-size:1.25rem;
  font-weight:700;
  color:var(--txt);
  letter-spacing:-.02em;
  display:block;
  margin-bottom:.2rem;
}
.title::after{
  content:'';
  display:inline-block;
  width:6px;height:6px;
  background:var(--lime);
  border-radius:50%;
  margin-left:.45rem;
  vertical-align:middle;
  position:relative;top:-1px;
}

/* Section labels */
.slabel{
  font-size:.65rem;
  font-weight:600;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--txt3);
  margin-bottom:.75rem;
}

/* Input rows */
.row{display:flex;align-items:center;justify-content:space-between;padding:.45rem 0;gap:.75rem}
.lbl{font-size:.82rem;font-weight:500;color:var(--txt2);min-width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iw{
  display:flex;align-items:center;gap:.35rem;
  background:var(--s3);
  border:1px solid var(--bdr2);
  border-radius:8px;
  padding:.38rem .65rem;
  transition:border-color .15s;
  flex:1;max-width:170px;
}
.iw:focus-within{border-color:var(--lime);box-shadow:0 0 0 3px var(--lime-glow)}
.cur{color:var(--txt3);font-size:.68rem;font-weight:600;user-select:none;font-family:'JetBrains Mono',monospace;white-space:nowrap}
input[type=number],input[type=text]{
  background:transparent;border:none;outline:none;
  color:var(--txt);font-family:'JetBrains Mono',monospace;
  font-size:.88rem;width:100%;text-align:right;
  -moz-appearance:textfield
}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}

hr.div{border:none;border-top:1px solid var(--bdr);margin:.6rem 0}
hr.thick{border-top-color:var(--bdr2)}

/* Total box */
.tbox{
  border-radius:8px;padding:.65rem .9rem;margin:.35rem 0;
  display:flex;align-items:center;justify-content:space-between;
  background:var(--lime-dim);
  border:1px solid rgba(26,108,246,.25);
}
.tlbl{font-size:.65rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--txt2)}
.tval{font-size:1.05rem;font-weight:700;color:var(--lime)}

/* Buttons */
.brow{display:flex;gap:.5rem;margin-top:1rem}
.btn{
  flex:1;padding:.65rem .5rem;border-radius:8px;border:none;cursor:pointer;
  font-family:'Manrope',sans-serif;font-size:.72rem;font-weight:600;
  letter-spacing:.04em;transition:all .15s;
  display:flex;align-items:center;justify-content:center;gap:.4rem
}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none !important}
.btn-s{background:var(--lime);color:#fff}
.btn-s:hover:not(:disabled){background:#3d7ef7;transform:translateY(-1px)}
.btn-s.ok{background:rgba(52,212,122,.15);border:1px solid rgba(52,212,122,.3);color:var(--green)}
.btn-c{background:var(--s3);border:1px solid var(--bdr2);color:var(--txt2)}
.btn-c:hover:not(:disabled){background:var(--s2);color:var(--txt);transform:translateY(-1px)}
.btn-i{background:transparent;border:1px solid var(--bdr2);color:var(--txt3)}
.btn-i:hover:not(:disabled){background:var(--s3);color:var(--txt2);transform:translateY(-1px)}

/* Status */
.smsg{font-size:.68rem;color:var(--txt3);text-align:center;margin-top:.45rem;min-height:1.2em}
.smsg.err{color:var(--red)}
.status-bar{
  display:flex;align-items:center;gap:.5rem;font-size:.62rem;color:var(--txt3);
  padding:.45rem .75rem;background:var(--s2);border-radius:8px;margin-top:.65rem;
  border:1px solid var(--bdr)
}
.dot{width:6px;height:6px;border-radius:50%;background:var(--txt3);flex-shrink:0}
.dot.ok{background:var(--green)}
.dot.err{background:var(--red)}
.dot.loading{background:var(--lime);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

/* Chart card */
.ch{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:.75rem;flex-wrap:wrap;gap:.4rem}
.ct{font-size:.9rem;font-weight:700;color:var(--txt);letter-spacing:-.01em}
.cs{font-size:.62rem;color:var(--txt3);font-family:'JetBrains Mono',monospace}

/* Legend */
.leg{display:flex;gap:.5rem;margin-bottom:.75rem;flex-wrap:wrap}
.li{display:flex;align-items:center;gap:.35rem;font-size:.68rem;font-weight:500;color:var(--txt2)}
.ld{width:7px;height:7px;border-radius:2px;flex-shrink:0}
.leg-btn{
  cursor:pointer;padding:.2rem .55rem;border-radius:6px;
  transition:all .12s;border:1px solid transparent;user-select:none
}
.leg-btn:hover{background:var(--s3);border-color:var(--bdr2)}
.leg-btn.active{opacity:1}
.leg-btn.inactive{opacity:.3}
.leg-btn[data-ds="all"]{border-color:rgba(26,108,246,.25);background:var(--lime-glow)}

/* Filter */
.filt{display:flex;align-items:center;gap:.5rem;margin-bottom:.75rem;flex-wrap:wrap}
.filt select,.filt input[type=date]{
  background:var(--s3);border:1px solid var(--bdr2);
  border-radius:7px;color:var(--txt);
  font-family:'Manrope',sans-serif;font-size:.7rem;font-weight:500;
  padding:.32rem .6rem;outline:none;cursor:pointer
}
.filt select:focus,.filt input[type=date]:focus{border-color:var(--lime)}
.filt input[type=date]{color-scheme:dark}
.cw{position:relative;height:220px}

/* Table */
.th{
  padding:.85rem 1.25rem;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--bdr)
}
.tt{font-size:.65rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--txt3)}
.tw{overflow-x:auto;max-height:260px;overflow-y:auto}
@media(min-width:800px){.tw{max-height:380px}}
table{width:100%;border-collapse:collapse;font-size:.74rem}
thead th{
  position:sticky;top:0;background:var(--s2);
  padding:.5rem .65rem;text-align:left;
  font-size:.58rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--txt3);border-bottom:1px solid var(--bdr);white-space:nowrap
}
tbody tr{border-bottom:1px solid rgba(255,255,255,.03);transition:background .1s}
tbody tr:hover{background:rgba(255,255,255,.025)}
tbody td{padding:.48rem .65rem;white-space:nowrap;font-family:'JetBrains Mono',monospace;font-size:.72rem}
tbody td:first-child{font-family:'Manrope',sans-serif;font-weight:500}
tbody td:not(:first-child){text-align:right}
.dt{color:var(--txt3)}
.dtt{color:var(--lime);font-weight:600}
.xb{
  background:none;border:none;cursor:pointer;color:var(--txt3);
  font-size:.72rem;padding:.1rem .3rem;border-radius:4px;transition:color .12s,background .12s
}
.xb:hover{color:var(--red);background:rgba(255,79,79,.1)}
.es{padding:2rem;text-align:center;color:var(--txt3);font-size:.76rem;line-height:1.9}
#fi{display:none}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:4px}
</style>
</head>
<body>
<div class="page">

<div class="card">
  <div class="header">
    <span class="emojis">&#x1F4B5; &#x1F4B8; &#x1F911; &#x1F3E6;</span>
    <div class="title">Resumen Financiero</div>
  </div>
  <div class="slabel">Activos</div>
  <div class="row">
    <span class="lbl">Caja de Seguridad</span>
    <div class="iw"><span class="cur">U$D</span><input type="number" id="caja" step="0.01" min="0" placeholder="0" placeholder="0.00" step="0.01" min="0"></div>
  </div>
  <div class="row">
    <span class="lbl">Balanz</span>
    <div class="iw"><span class="cur">U$D</span><input type="number" id="balanz" step="0.01" min="0" placeholder="0" placeholder="0.00" step="0.01" min="0"></div>
  </div>
  <div class="row">
    <span class="lbl">FCI Banco Galicia</span>
    <div class="iw"><span class="cur">U$D</span><input type="number" id="fci" step="0.01" min="0" placeholder="0" placeholder="0.00" step="0.01" min="0"></div>
  </div>
  <hr class="div thick">
  <div class="tbox">
    <span class="tlbl">Total</span>
    <span class="tval" id="total">U$D 0,00</span>
  </div>
  <div class="tbox" id="tbox-ars" style="margin-top:.4rem;background:rgba(255,255,255,.04);border-color:var(--bdr2)">
    <span class="tlbl" style="color:var(--txt3)">En pesos &nbsp;<span id="mep-badge" style="font-size:.55rem;background:var(--s3);border:1px solid var(--bdr2);padding:.1rem .4rem;border-radius:4px;color:var(--txt3)">cargando MEP...</span></span>
    <span class="tval" id="total-ars" style="color:var(--txt2)">&#x2014;</span>
  </div>
  <div class="brow">
    <button class="btn btn-s" id="saveBtn" onclick="saveRecord()">&#x1F4BE; Guardar hoy</button>
  </div>

  <div class="status-bar">
    <div class="dot" id="sdot"></div>
    <span id="stxt">Conectando con Google Sheets...</span>
  </div>
  <div class="smsg" id="smsg"></div>
</div>

<div class="chart-card">
  <div class="ch">
    <span class="ct">Evoluci&#xF3;n del Portfolio</span>
    <span class="cs" id="cr">&#x2014;</span>
  </div>
  <div class="leg" id="chartLegend">
    <div class="li leg-btn active" data-ds="all" onclick="toggleDataset('all')"><div class="ld" style="background:var(--lime)"></div>Todos</div>
    <div class="li leg-btn active" data-ds="0" onclick="toggleDataset('0')"><div class="ld" style="background:#fb923c"></div>FCI Galicia</div>
    <div class="li leg-btn active" data-ds="1" onclick="toggleDataset('1')"><div class="ld" style="background:#c83250"></div>Caja</div>
    <div class="li leg-btn active" data-ds="2" onclick="toggleDataset('2')"><div class="ld" style="background:#1a6cf6"></div>Balanz</div>
  </div>
  <div class="filt">
    <select id="filtPreset" onchange="applyPreset()">
      <option value="all">Todo el per&#xED;odo</option>
      <option value="1m">&#xDA;ltimo mes</option>
      <option value="3m">&#xDA;ltimos 3 meses</option>
      <option value="6m">&#xDA;ltimos 6 meses</option>
      <option value="1y">&#xDA;ltimo a&#xF1;o</option>
      <option value="ytd">Año en curso (YTD)</option>
       <option value="custom">Personalizado...</option>
    </select>
    <div id="customDates" style="display:none">
      <input type="date" id="dateFrom" onchange="applyFilter()">
      <span style="color:var(--muted)">&#x2192;</span>
      <input type="date" id="dateTo" onchange="applyFilter()">
    </div>
  </div>
  <div class="cw"><canvas id="myChart"></canvas></div>
</div>

<div class="tcrd">
  <div class="th">
    <span class="tt">Hist&#xF3;rico d&#xED;a a d&#xED;a</span>
    <button class="btn btn-c" style="flex:none;padding:.4rem .8rem;font-size:.62rem" onclick="exportCSV()">&#x2B07; Exportar CSV</button>
  </div>
  <div class="tw">
    <table>
      <thead><tr><th>Fecha</th><th>Caja</th><th>Balanz</th><th>FCI</th><th>Total</th><th></th></tr></thead>
      <tbody id="tb"></tbody>
    </table>
    <div class="es" id="es">Cargando...</div>
  </div>
</div>

</div>

// ── UTILS ──
function fmt(n) {
  var parts = Number(n).toFixed(2).split('.');
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return 'U$D ' + parts[0] + ',' + parts[1];
}
function todayISO() {
  var d = new Date();
  return d.getFullYear() + '-' +
    String(d.getMonth()+1).padStart(2,'0') + '-' +
    String(d.getDate()).padStart(2,'0');
}
function ddisp(iso) {
  // Handle Date objects or strings like "2026-02-24T03:00:00.000Z"
  var s = String(iso).substring(0, 10);
  var p = s.split('-');
  if (p.length !== 3) return String(iso);
  return p[2]+'/'+p[1]+'/'+p[0];
}
function toISO(val) {
  // Normalize any date value to YYYY-MM-DD string
  var s = String(val).substring(0, 10);
  return s;
}

// ── CALC ──
function fmtInput(n) {
  if (n === '' || n === null || isNaN(n)) return '';
  var parts = Number(n).toFixed(2).split('.');
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return parts[0] + ',' + parts[1];
}
function parseInput(id) {
  var v = document.getElementById(id).value.trim();
  // Remove thousand separators (.) then replace decimal comma with dot
  v = v.replace(/\./g, '').replace(',', '.');
  return parseFloat(v) || 0;
}
function formatField(id) {
  var raw = parseInput(id);
  var el  = document.getElementById(id);
  if (raw > 0) el.value = fmtInput(raw);
}

}

function setBadge(txt, ok) {

function tryMEPSource(index) {
  if (index >= MEP_SOURCES.length) {
    setBadge('MEP no disponible', false);
    return;
  }
  var src = MEP_SOURCES[index];
  fetch(src.url)
    .then(function(r) {
      if (!r.ok) throw new Error(r.status);
      return r.json();
    })
    .then(function(data) {
      var v = src.parse(data);
      if (v > 0) {
        mepVal = v;
        setBadge('MEP $' + Math.round(v).toLocaleString('es-AR') + ' \u00b7 ' + src.name, true);
        calc();
      } else {
        tryMEPSource(index + 1);
      }
    })
    .catch(function() {
      tryMEPSource(index + 1);
    });
}

function fetchMEP() {
  setBadge('cargando MEP...', false);
  tryMEPSource(0);
}

function calc() {
  var c = parseFloat(document.getElementById('caja').value) || 0;
  var b = parseFloat(document.getElementById('balanz').value) || 0;
  var f = parseFloat(document.getElementById('fci').value) || 0;
  var total = c + b + f;
  document.getElementById('total').textContent = fmt(total);
  var arsEl = document.getElementById('total-ars');
  if (arsEl) {
    if (mepVal && total > 0) {
      arsEl.textContent = fmtARS(total * mepVal);
    } else if (total === 0) {
      arsEl.textContent = fmtARS(0);
    } else {
      arsEl.textContent = '—';
    }
  }
}
['caja','balanz','fci'].forEach(function(id) {
  document.getElementById(id).addEventListener('input', calc);
});

// ── LOAD FROM SHEET ──
function loadFromSheet() {
  setStatus('loading', 'Cargando datos...');
  setBtns(true);
  apiGet().then(function(res) {
    if (res.records && res.records.length > 0) {
      cache = res.records.map(function(r) {
        return {date:toISO(r.date), caja:r.caja, balanz:r.balanz, fci:r.fci||0, total:r.total};
      });
      fillLatest();
      seeded = true;
      setStatus('ok', 'Conectado \u2022 ' + cache.length + ' registros');
      renderAll();
      setBtns(false);
    } else {
      // Sheet empty — seed it with historical data
      setStatus('loading', 'Cargando datos hist\u00f3ricos en Sheets...');
      apiPost({action: 'seed', records: SEED}).then(function(r2) {
        cache = SEED.slice();
        seeded = true;
        setStatus('ok', 'Datos hist\u00f3ricos cargados \u2022 ' + cache.length + ' registros');
        renderAll();
        setBtns(false);
      }).catch(function(e) {
        cache = SEED.slice();
        seeded = true;
        setStatus('err', 'Sheets no disponible \u2014 modo offline');
        renderAll();
        setBtns(false);
      });
    }
  }).catch(function(err) {
    // Offline fallback: use seed
    cache = SEED.slice();
    seeded = true;
    setStatus('err', 'Sin conexi\u00f3n \u2014 modo offline');
    renderAll();
    setBtns(false);
  });
}

function setBtns(disabled) {
  ['saveBtn'].forEach(function(id) {

  });
}

// ── SAVE RECORD ──
function saveRecord() {
  var c = parseFloat(document.getElementById('caja').value) || 0;
  var b = parseFloat(document.getElementById('balanz').value) || 0;
  var f = parseFloat(document.getElementById('fci').value) || 0;
  var t = c + b + f;
  var td = todayISO();
  var rec = {date:td, caja:c, balanz:b, fci:f, total:t};

  // Update local cache immediately
  var idx = cache.findIndex(function(r){return r.date===td;});
  if (idx >= 0) cache[idx] = rec; else cache.push(rec);
  cache.sort(function(a,b){return a.date < b.date ? -1 : 1;});
  renderAll();

  var btn = document.getElementById('saveBtn');
  var msg = document.getElementById('smsg');
  btn.textContent = '\u2713 Guardado'; btn.classList.add('ok');
  msg.textContent = '';
  setStatus('loading', 'Guardando en Sheets...');

  apiPost({action:'upsert', record:rec}).then(function(res) {
    if (res.ok) {
      setStatus('ok', 'Guardado en Sheets \u2022 ' + cache.length + ' registros');
      msg.textContent = 'Registro del ' + ddisp(td) + ' guardado.';
    } else {
      setStatus('err', 'Error al guardar en Sheets');
      msg.className = 'smsg err';
      msg.textContent = 'Error: ' + (res.error || 'desconocido');
    }
  }).catch(function() {
    setStatus('err', 'Sin conexi\u00f3n \u2014 guardado solo localmente');
    msg.textContent = 'Guardado localmente (sin conexi\u00f3n).';
  });

  setTimeout(function(){
    btn.innerHTML='&#x1F4BE; Guardar hoy'; btn.classList.remove('ok');
    setTimeout(function(){ msg.textContent=''; msg.className='smsg'; }, 3000);
  }, 2000);
}

// ── DELETE ──
function delRec(date) {
  if (!confirm('Eliminar el registro del ' + ddisp(date) + '?')) return;
  cache = cache.filter(function(r){return r.date!==date;});
  renderAll();
  setStatus('loading', 'Eliminando...');
  apiPost({action:'delete', date:date}).then(function(res) {
    setStatus('ok', res.ok ? 'Eliminado' : 'Error al eliminar');
  }).catch(function(){ setStatus('err', 'Sin conexi\u00f3n'); });
}

// ── EXPORT CSV ──
function exportCSV() {
  if (!cache.length) { alert('No hay datos.'); return; }
  var rows = 'fecha,caja_seguridad,balanz,fci_galicia,total\n';
  cache.forEach(function(r){
    rows += r.date+','+r.caja+','+r.balanz+','+(r.fci||0)+','+r.total+'\n';
  });
  var blob = new Blob([rows], {type:'text/csv;charset=utf-8;'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'finanzas_'+todayISO()+'.csv';
  a.click();
}

// ── IMPORT CSV ──
function importCSV(event) {
  var file = event.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    var lines = e.target.result.trim().split(/\r?\n/);
    if (lines.length < 2) { alert('CSV vacío.'); return; }
    var sep = lines[0].indexOf(';') >= 0 ? ';' : ',';
    var hdr = lines[0].toLowerCase().split(sep).map(function(h){return h.trim();});
    var ci = {
      date:   hdr.findIndex(function(h){return h.indexOf('fecha')>=0||h==='date';}),
      caja:   hdr.findIndex(function(h){return h.indexOf('caja')>=0;}),
      balanz: hdr.findIndex(function(h){return h.indexOf('balanz')>=0;}),
      fci:    hdr.findIndex(function(h){return h.indexOf('fci')>=0||h.indexOf('galicia')>=0;})
    };
    if (ci.date<0||ci.caja<0||ci.balanz<0) { alert('Columnas no reconocidas.'); return; }
    var imported = 0;
    for (var i = 1; i < lines.length; i++) {
      var line = lines[i].trim(); if (!line) continue;
      var cols = line.split(sep).map(function(c){return c.trim();});
      var ds = cols[ci.date]; if (!ds) continue;
      var m = ds.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
      if (m) ds = m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
      if (!/^\d{4}-\d{2}-\d{2}$/.test(ds)) continue;
      var caja=parseFloat(cols[ci.caja])||0, balanz=parseFloat(cols[ci.balanz])||0;
      var fci=ci.fci>=0?(parseFloat(cols[ci.fci])||0):0;
      var rec={date:ds,caja:caja,balanz:balanz,fci:fci,total:caja+balanz+fci};
      var pos=cache.findIndex(function(r){return r.date===ds;});
      if(pos>=0) cache[pos]=rec; else cache.push(rec);
      imported++;
    }
    cache.sort(function(a,b){return a.date<b.date?-1:1;});
    renderAll();
    setStatus('loading','Subiendo '+imported+' registros a Sheets...');
    apiPost({action:'seed',records:cache}).then(function(res){
      setStatus('ok','Importados '+imported+' registros en Sheets');
    }).catch(function(){
      setStatus('err','Importado localmente, sin conexi\u00f3n con Sheets');
    });
    var msg=document.getElementById('smsg');
    msg.textContent='\u2713 '+imported+' registros importados.';
    setTimeout(function(){msg.textContent='';},4000);
  };
  reader.readAsText(file);
  event.target.value='';
}

var chartInst = null;
function renderChart(h) {
  var labels = h.map(function(r){return ddisp(r.date);});
  var dF = h.map(function(r){return r.fci||0;});
  var dC = h.map(function(r){return r.caja||0;});
  var dB = h.map(function(r){return r.balanz||0;});

  var rng = document.getElementById('cr');
  if(h.length>=2) rng.textContent = labels[0]+' \u2192 '+labels[h.length-1];
  else if(h.length===1) rng.textContent = labels[0];
  else rng.textContent = '\u2014';

  var pr = h.length<=30 ? 3 : (h.length<=120 ? 1 : 0);
  if(chartInst) chartInst.destroy();

  chartInst = new Chart(document.getElementById('myChart'), {
    type: 'line',
    data: {
      labels: labels,
      datasets: [
        // Bottom band: FCI — orange
        {
          label: 'FCI Galicia',
          data: dF,
          fill: 'origin',
          backgroundColor: 'rgba(251,146,60,0.55)',
          borderColor: 'rgba(251,146,60,0.85)',
          borderWidth: 1.5,
          pointRadius: pr, pointHoverRadius: 6,
          pointBackgroundColor: 'rgba(251,146,60,1)',
          pointBorderColor: '#0d0f14', pointBorderWidth: 1,
          tension: 0.38
        },
        // Middle band: Caja — bordeaux
        {
          label: 'Caja de Seguridad',
          data: dC,
          fill: '-1',
          backgroundColor: 'rgba(159,18,57,0.5)',
          borderColor: 'rgba(200,50,80,0.85)',
          borderWidth: 1.5,
          pointRadius: pr, pointHoverRadius: 6,
          pointBackgroundColor: 'rgba(200,50,80,1)',
          pointBorderColor: '#0d0f14', pointBorderWidth: 1,
          tension: 0.38
        },
        // Top band: Balanz — blue
        {
          label: 'Balanz',
          data: dB,
          fill: '-1',
          backgroundColor: 'rgba(26,108,246,0.3)',
          borderColor: 'rgba(61,126,247,0.9)',
          borderWidth: 1.5,
          pointRadius: pr, pointHoverRadius: 6,
          pointBackgroundColor: 'rgba(61,126,247,1)',
          pointBorderColor: '#0d0f14', pointBorderWidth: 1,
          tension: 0.38
        }
      ]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{display:false},
        tooltip:{
          backgroundColor:'#16181f',borderColor:'#2a2d38',borderWidth:1,
          titleColor:'#9ca3af',bodyColor:'#f0f1f3',
          titleFont:{family:'DM Mono',size:11},bodyFont:{family:'DM Mono',size:12},
          padding:12,
          callbacks:{
            label:function(c){return '  '+c.dataset.label+': '+fmt(c.parsed.y);},
            footer:function(items){
              var t=items.reduce(function(s,i){return s+i.parsed.y;},0);
              return '  Total: '+fmt(t);
            }
          },
          footerColor:'#1a6cf6',footerFont:{family:'DM Mono',size:12,weight:'500'}
        }
      },
      scales:{
        x:{stacked:true,grid:{color:'rgba(255,255,255,0.04)',drawTicks:false},
           ticks:{color:'#6b7280',font:{family:'DM Mono',size:10},maxTicksLimit:7,maxRotation:40},
           border:{color:'rgba(255,255,255,0.07)'}},
        y:{stacked:true,grid:{color:'rgba(255,255,255,0.04)',drawTicks:false},
           ticks:{color:'#6b7280',font:{family:'DM Mono',size:10},
             callback:function(v){
               if(v>=1000000)return '$'+(v/1000000).toFixed(1)+'M';
               if(v>=1000)return '$'+(v/1000).toFixed(0)+'k';
               return '$'+v;
             }},
           border:{color:'rgba(255,255,255,0.07)'}}
      }
    }
  });
}

// ── TABLE ──
function renderTable(h) {
  var tb=document.getElementById('tb');
  var es=document.getElementById('es');
  tb.innerHTML='';
  if(!h.length){es.style.display='block';return;}
  es.style.display='none';
  h.slice().reverse().forEach(function(r){
    var tr=document.createElement('tr');
    tr.innerHTML=
      '<td class="dt">'+ddisp(r.date)+'</td>'+
      '<td>'+fmt(r.caja)+'</td>'+
      '<td>'+fmt(r.balanz)+'</td>'+
      '<td>'+fmt(r.fci||0)+'</td>'+
      '<td class="dtt">'+fmt(r.total)+'</td>'+
      '<td><button class="xb" onclick="delRec(\''+r.date+'\')">&#x2715;</button></td>';
    tb.appendChild(tr);
  });
}

// ── DATE FILTER ──
function applyPreset() {
  var val = document.getElementById('filtPreset').value;
  var custom = document.getElementById('customDates');
  if (val === 'custom') {
    custom.style.display = 'flex';
    return;
  }
  custom.style.display = 'none';
  var to = todayISO();
  var from = null;
  if (val === '1m') from = offsetDate(to, -1);
  else if (val === '3m') from = offsetDate(to, -3);
  else if (val === '6m') from = offsetDate(to, -6);
  else if (val === '1y') from = offsetDate(to, -12);
  else if (val === 'ytd') { from = new Date().getFullYear() + '-01-01'; }
  var customDiv = document.getElementById('customDates');
  if (customDiv) customDiv.style.display = (val === 'custom') ? 'flex' : 'none';
  var filtered = from ? cache.filter(function(r){return r.date >= from && r.date <= to;}) : cache;
  renderChart(filtered);
}

function applyFilter() {
  var from = document.getElementById('dateFrom').value;
  var to   = document.getElementById('dateTo').value;
  if (!from && !to) { renderChart(cache); return; }
  var filtered = cache.filter(function(r){
    if (from && r.date < from) return false;
    if (to   && r.date > to)   return false;
    return true;
  });
  renderChart(filtered);
}

function offsetDate(iso, months) {
  var d = new Date(iso + 'T00:00:00');
  d.setMonth(d.getMonth() + months);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function renderAll(){renderChart(cache);renderTable(cache);}

function toggleDataset(idx) {
  if (!chartInst) return;
  var btns = document.querySelectorAll('.leg-btn');

  if (idx === 'all') {
    // Mostrar todos
    chartInst.data.datasets.forEach(function(ds, i) {
      chartInst.setDatasetVisibility(i, true);
    });
    btns.forEach(function(b) { b.classList.add('active'); b.classList.remove('inactive'); });
  } else {
    var dsIdx = parseInt(idx);
    // Toggle individual: si está visible lo oculta, si está oculto lo muestra
    var isVisible = chartInst.isDatasetVisible(dsIdx);
    // No permitir que queden todos ocultos
    var visibleCount = 0;
    chartInst.data.datasets.forEach(function(ds, i) { if (chartInst.isDatasetVisible(i)) visibleCount++; });
    if (isVisible && visibleCount === 1) {
      // Es el último visible — restaurar todos
      chartInst.data.datasets.forEach(function(ds, i) { chartInst.setDatasetVisibility(i, true); });
      btns.forEach(function(b) { b.classList.add('active'); b.classList.remove('inactive'); });
      chartInst.update();
      return;
    }
    chartInst.setDatasetVisibility(dsIdx, !isVisible);
    // Actualizar estado del botón tocado
    btns.forEach(function(b) {
      var bIdx = b.getAttribute('data-ds');
      if (bIdx === 'all') {
        // "Todos" activo solo si todos están visibles
        var allVis = true;
        chartInst.data.datasets.forEach(function(ds, i) { if (!chartInst.isDatasetVisible(i)) allVis = false; });
        b.classList.toggle('active', allVis);
        b.classList.toggle('inactive', !allVis);
      } else {
        var vis = chartInst.isDatasetVisible(parseInt(bIdx));
        b.classList.toggle('active', vis);
        b.classList.toggle('inactive', !vis);
      }
    });
  }
  chartInst.update();
}

// ── FILL FIELDS WITH LATEST RECORD ──
function fillLatest() {
  if (!cache.length) return;
  var last = cache[cache.length - 1];
  document.getElementById('caja').value   = last.caja   || '';
  document.getElementById('balanz').value = last.balanz || '';
  document.getElementById('fci').value    = last.fci    || '';
  calc();
}

fetchMEP();
setInterval(fetchMEP, 5 * 60 * 1000);
